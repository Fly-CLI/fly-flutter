name: fly_foundation
description: Meta-package that re-exports all Fly foundation packages for convenience
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Foundation packages
  fly_logger:
    path: ../fly_logger
  fly_localization:
    path: ../fly_localization
  fly_di:
    path: ../fly_di
  fly_connectivity:
    path: ../fly_connectivity
  fly_errors:
    path: ../fly_errors
  fly_events:
    path: ../fly_events
  fly_navigation:
    path: ../fly_navigation
  fly_operations:
    path: ../fly_operations
  fly_mvvm:
    path: ../fly_mvvm
  
  # External dependencies used by foundation packages
  fly_feedback:
    path: ../fly_feedback

