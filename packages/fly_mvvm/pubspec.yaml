name: fly_mvvm
description: MVVM base classes for ViewModels and Screens for Flutter applications
version: 0.1.0
homepage: https://github.com/fly-cli/fly
repository: https://github.com/fly-cli/fly.git
issue_tracker: https://github.com/fly-cli/fly/issues
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.10.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  fly_connectivity:
    path: ../fly_connectivity
  fly_errors:
    path: ../fly_errors
  fly_events:
    path: ../fly_events
  fly_feedback:
    path: ../fly_feedback
  fly_localization:
    path: ../fly_localization
  fly_logger:
    path: ../fly_logger
  fly_flow_guard:
    path: ../fly_flow_guard

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

