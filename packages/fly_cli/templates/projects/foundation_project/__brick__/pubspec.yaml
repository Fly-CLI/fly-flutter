name: {{project_name_snake}}
description: {{description}}
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.0.3
  riverpod: ^3.0.3
  riverpod_annotation: ^3.0.0

  # Navigation
  go_router: ^12.1.0

  # Utilities
  logging: ^1.3.0
  intl: ^0.20.2
  uuid: ^4.2.1

  # Networking (optional, for connectivity service)
  connectivity_plus: ^7.0.0

  # Fly packages
  fly_core:
    path: ../../packages/fly_core
  fly_networking:
    path: ../../packages/fly_networking

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Code Generation
  build_runner: ^2.4.8
  riverpod_generator: ^3.0.3

flutter:
  uses-material-design: true

