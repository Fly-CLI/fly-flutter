name: foundation_project
description: Comprehensive Flutter foundation project with Riverpod, MVVM architecture, and best practices
version: 1.0.0

vars:
  project_name:
    type: string
    description: Name of the project
    prompt: What is your project name?
  organization:
    type: string
    description: Organization identifier
    default: com.example
    prompt: What is your organization?
  platforms:
    type: list
    description: Target platforms
    default: [ ios, android ]
    prompt: Which platforms do you want to support?
  description:
    type: string
    description: Project description
    default: A comprehensive Flutter foundation project with Riverpod, MVVM architecture, and best practices
    prompt: What is your project description?


