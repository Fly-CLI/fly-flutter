name: {{project_name.snakeCase()}}
description: {{description}}
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>={{min_dart_sdk}} <4.0.0'
  flutter: '>={{min_flutter_sdk}}'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^3.0.3
  hooks_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0
{{#fly_packages}}
  {{.}}: ^0.1.0
{{/fly_packages}}
  intl: ^0.18.1
  auto_mappr_annotation: ^2.0.0
  drift: ^2.29.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.2
  connectivity_plus: ^5.0.1
  logging: ^1.2.0
{{#ai_integration}}
  fly_mcp: ^0.1.0
{{/ai_integration}}

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^3.0.3
  json_serializable: ^6.8.0
  auto_mappr: ^2.0.0
  drift_dev: ^2.29.0
  mason: ^0.1.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  generate: true

assets:
  - assets/

