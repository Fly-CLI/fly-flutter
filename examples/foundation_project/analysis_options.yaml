include: package:flutter_lints/flutter.yaml

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - avoid_redundant_argument_values
    - avoid_unnecessary_containers
    - avoid_unused_constructor_parameters
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
  # Note: For ViewModels extending ViewModel base class, always use runAsyncOperation()
  # for async operations to ensure consistent error handling, loading state management,
  # and network awareness. Manual try-catch blocks with state updates should be avoided.
  # This is enforced by the analyzer plugin rule: view_model_async_must_use_perform_async

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    invalid_annotation_target: ignore
  plugins:
    # Standard analyzer plugin for custom lint rules
    # Works with 'flutter analyze' and 'dart analyze'
    - foundation_project_lints

